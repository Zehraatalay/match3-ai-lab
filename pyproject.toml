[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "match3-ai-lab"
version = "0.1.0"
description = "A modular Match-3 AI research environment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0,<2",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
ui = [

    "pygame>=2.6,<3",

]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"