[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "match3-ai-lab"
version = "0.1.0"
description = "A modular Match-3 AI research environment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=1.0,<2",

]

[project.optional-dependencies]
rl = [
    "torch>=2.2, <3",
]
analysis = [
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
ui = [

    "pygame>=2.6,<3",

]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
match3_ai = ["levels/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
